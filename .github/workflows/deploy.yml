name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  test-build-push-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias y ejecutar pruebas
        run: |
          pip install --no-cache-dir -r requirements.txt
          PYTHONPATH=. pytest -v

      - name: Iniciar sesión en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Construir y publicar imagen inmutable con SHA
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/cicd-demo-app:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/cicd-demo-app:latest

      - name: Disparar despliegue automático en Render
        run: |
          curl -fsSL -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
          echo "Deploy hook disparado para commit ${{ github.sha }}"