name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  test:
    name: 1. Pruebas Unitarias (CI)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias y ejecutar pytest
        run: |
          pip install --no-cache-dir -r requirements.txt
          PYTHONPATH=. pytest -v

  build-and-push:
    name: 2. Construcción e Imagen Inmutable
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Iniciar sesión en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Construir y publicar imagen con SHA
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/cicd-demo-app:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/cicd-demo-app:latest

  deploy:
    name: 3. Despliegue Continuo en Render (CD)
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Disparar despliegue automático en Render
        run: |
          curl -fsSL -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
          echo "Deploy hook disparado para commit ${{ github.sha }}"